spring.application.name=devmail

# Web UI + REST API
server.port=5000

# One virtual thread per request / SSE connection
spring.threads.virtual.enabled=true

# SMTP sink. Point your app at this host/port (e.g. spring.mail.host=localhost, spring.mail.port=2525).
devmail.smtp.host=0.0.0.0
devmail.smtp.port=2525
devmail.smtp.max-message-size=10MB

# Oldest messages are dropped beyond this many
devmail.store.max-messages=500
